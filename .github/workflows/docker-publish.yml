name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - version.txt
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    if: github.repository == 'ludditious/NginxProxyManager-ToolBox'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ludditious/nginxproxymanager-toolbox
    steps:
      - name: Confirm canonical repository
        run: |
          if [ "${{ github.repository }}" != "ludditious/NginxProxyManager-ToolBox" ]; then
            echo "Refusing to publish: expected ludditious/NginxProxyManager-ToolBox, got ${{ github.repository }}"
            exit 1
          fi
          echo "Publishing from ${{ github.repository }} to ${IMAGE}"

      - uses: actions/checkout@v4

      - name: Write version.txt for this image
        id: ver
        run: |
          VER="$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          echo "$VER" > version.txt
          echo "version=$VER" >> "$GITHUB_ENV"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/ludditious/NginxProxyManager-ToolBox
            org.opencontainers.image.url=https://github.com/ludditious/NginxProxyManager-ToolBox
            org.opencontainers.image.title=NginxProxyManager-ToolBox
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.version }}
          platforms: linux/amd64
          provenance: false
          sbom: false

      - name: Link GHCR package to this repository
        uses: actions/github-script@v7
        with:
          script: |
            const repoId = context.payload.repository.id;
            try {
              await github.request(
                "PUT /user/packages/container/nginxproxymanager-toolbox/repositories/{repository_id}",
                { repository_id: repoId }
              );
            } catch (err) {
              core.warning(`Could not link package: ${err.message}`);
            }

      - uses: actions/upload-artifact@v4
        with:
          name: published-version-txt
          path: version.txt

  sync-version-txt:
    needs: build-and-push
    if: github.repository == 'ludditious/NginxProxyManager-ToolBox' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: published-version-txt
          path: .

      - name: Commit version.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f published-version-txt/version.txt ]; then
            mv published-version-txt/version.txt version.txt
            rmdir published-version-txt 2>/dev/null || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git diff --staged --quiet && exit 0
          git commit -m "chore: version.txt for image publish [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
