{% extends "base.html" %}
{% block title %} - Recover{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Forgot password</h1>
  {% if error %}<p class="notice notice-err">{{ error }}</p>{% endif %}
  {% if success %}<p class="notice notice-ok">{{ success }}</p>{% endif %}
  <form method="post" action="/recover">
    <label>Username<input type="text" name="username" required></label>
    {% for q in security_questions %}
    <label>{{ q }}<input type="text" name="answer_{{ loop.index }}" required autocomplete="off"></label>
    {% endfor %}
    <label>New password<input type="password" name="new_password" minlength="8" required></label>
    <label>Confirm<input type="password" name="confirm_password" minlength="8" required></label>
    <button type="submit">Reset password</button>
  </form>
</section>
{% endblock %}
